# Build the Jekyll site with `bundle exec jekyll build` (full Gemfile, not the
# classic GitHub Pages gem whitelist) and deploy it to GitHub Pages on every
# push to `main`. GitHub Pages "Build and deployment" source must be "GitHub Actions".
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Run test suites
        run: |
          ruby _scripts/lib/front_matter_test.rb
          ruby _scripts/validate_config_test.rb
          ruby _scripts/validate_urls_test.rb
          ruby bin/new-app_test.rb
      - name: Validate config
        run: ruby _scripts/validate_config.rb
      - name: Validate URL scheme
        run: ruby _scripts/validate_urls.rb
      - name: Lint legal-doc content
        run: ruby _scripts/lint_content.rb
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Validate redirects
        run: ruby _scripts/validate_redirects.rb
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
