title: "TurkWave App Legal & Support Documents"
description: "Privacy policies, terms of use, and support documents for TurkWave's applications."
url: "https://turkwave.github.io"
baseurl: ""

# Single source of truth for the support address shown on every app and
# document page. Change it here and it updates site-wide.
contact_email: "Turk191906@outlook.com"

# assets/site.scss is compiled to a single minified _site/assets/site.css.
sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  docs:
    output: true
    # Public URL scheme:  /<app-slug>/<doc-slug>/  (app index: /<app-slug>/).
    # :path is the collection-relative path without extension, e.g.
    # _docs/acme/privacy.md -> acme/privacy -> /acme/privacy/. Each index.md
    # sets an explicit  permalink: /<app-slug>/  (Jekyll would otherwise emit
    # /<app-slug>/index/). Former /apps/... URLs are kept alive by
    # jekyll-redirect-from (see redirect_from: in _docs/*/*.md).
    permalink: /:path/

defaults:
  - scope:
      type: "docs"
    values:
      layout: legal-doc

exclude:
  - _templates
  - _scripts
  - bin
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor
  - node_modules
