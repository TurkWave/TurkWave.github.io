title: "TurkWave App Legal & Support Documents"
description: "Privacy policies, terms of use, and support documents for TurkWave's applications."
url: "https://turkwave.github.io"
baseurl: ""

# Abort the build on a malformed front-matter block instead of warning and
# skipping the file - matches this repo's fail-fast validator philosophy.
strict_front_matter: true

# Single source of truth for the support address shown on every app and
# document page. Change it here and it updates site-wide.
contact_email: "Turk191906@outlook.com"

# assets/site.scss is compiled to a single minified _site/assets/site.css.
sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  docs:
    output: true
    # Public URL scheme:  /<app-slug>/<doc-slug>/  (app index: /<app-slug>/).
    # :path is the collection-relative path without extension, e.g.
    # _docs/acme/privacy.md -> acme/privacy -> /acme/privacy/. Each index.md
    # sets an explicit  permalink: /<app-slug>/  (Jekyll would otherwise emit
    # /<app-slug>/index/). Former /apps/... URLs are kept alive by
    # jekyll-redirect-from (see redirect_from: in _docs/*/*.md).
    permalink: /:path/

defaults:
  - scope:
      type: "docs"
    values:
      layout: legal-doc
      # jekyll-seo-tag types any dated document BlogPosting, and every
      # collection document is dated (Jekyll stamps it with the build time).
      # These are policy / support pages, so say WebPage instead.
      seo:
        type: WebPage
  # Sample apps that exist only to preview page layouts. `noindex` adds a
  # robots meta tag (_layouts/default.html); `sitemap: false` keeps them out of
  # sitemap.xml (jekyll-sitemap) and llms.txt. The trailing slash matters: scope
  # paths match by string prefix, so "_docs/demo-app" would also catch
  # "_docs/demo-app-2". Delete an entry to publish that app normally.
  - scope:
      path: "_docs/demo-app/"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "_docs/example-app/"
    values:
      noindex: true
      sitemap: false

exclude:
  - _templates
  - _scripts
  - bin
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - DEVELOPMENT.md
  - vendor
  - node_modules
