title: "TurkWave App Legal & Support Documents"
description: "Privacy policies, terms of use, and support documents for TurkWave's applications."
url: "https://turkwave.github.io"
baseurl: ""

theme: just-the-docs
nav_enabled: false
search_enabled: true

sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  docs:
    output: true
    permalink: /apps/:path/

defaults:
  - scope:
      type: "docs"
    values:
      layout: legal-doc

exclude:
  - _templates
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
